name: Verify workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies and browser
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Record exact source and environment
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python --version > evidence/environment.txt
          uname -a >> evidence/environment.txt
          python -m pip freeze >> evidence/environment.txt
          python -c 'import tenseal, numpy; print(tenseal.__version__, numpy.__version__)' > evidence/engine-import.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          files = sorted(p for root in ['veclab','tests','tools'] for p in Path(root).rglob('*') if p.is_file() and '__pycache__' not in p.parts)
          names = ['README.md','THIRD_PARTY_NOTICES.md','requirements.txt','requirements-dev.txt','run.sh','run.bat','.gitignore']
          files.extend(Path(n) for n in names)
          manifest = {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          Path('evidence/source-manifest.json').write_text(json.dumps(manifest,indent=2))
          with zipfile.ZipFile('evidence/tested-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,str(p))
          PY
      - name: Compile and execute backend tests with real CKKS
        run: |
          python -m compileall -q veclab tests tools
          node --check veclab/static/app.js
          python -m pytest -q --junitxml=evidence/tests.xml 2>&1 | tee evidence/tests.log
      - name: Execute real HTTP browser workflow and capture screenshots
        run: |
          python tools/browser_test.py --output evidence/browser 2>&1 | tee evidence/browser.log
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-workbench-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: error
